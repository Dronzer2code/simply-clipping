# F02 / FR-SIM-02 per-team power unit, aero and strategy coefficients.
#
# One entry per team_id appearing in config/grid/real_2026.yaml or
# config/grid/fictional.yaml. Keys are team_id (HR-06).
#
# EVERY numeric value below is a placeholder, marked "# PLACEHOLDER: calibrate",
# and is identical for all teams. docs/spec/TRD.md marks these coefficients UNKNOWN
# and leaves them to F20 calibration (T-026 for Suzuka), so no team is given an
# invented advantage here (HR-09). The two power limits are not invented: they
# are the Rule Set nominal values (power.p_ice_max_kw_nominal, power.p_k_max_kw)
# repeated per team so calibration can move each team off them individually.
#
# strategy_style drives the Rival Strategy AI (F08); BALANCED is the neutral
# option of the three, pending owner choice per team.
#
# Battery coefficients (T-022, TRD Battery): docs/spec/TRD.md names eta_discharge,
# harvest_share and partial_harvest_max_kw but gives no values, so they are
# placeholders like the rest: battery_discharge_efficiency (battery energy ->
# MGU-K electrical power), brake_harvest_share (fraction of braking power the
# MGU-K recovers; the rest is friction braking), partial_harvest_max_kw
# (part-throttle harvest power cap).
#
# fuel_energy_density_mj_per_kg (T-023, TRD Fuel): docs/spec/TRD.md takes it from
# config but gives no value; 43 MJ/kg is a typical petrol figure, per team
# because fuel suppliers differ. Placeholder like the rest.
#
# long_grip_ratio (T-024, owner round 9): mu_long = mu_lat * long_grip_ratio
# in the friction ellipse (traction and braking); default 1.0.
#
# pu_power_scale (T-026, owner round 10): per-team ICE power multiplier on
# p_ice_max_kw, representing engine differences.
#
# T-026 calibrates cla_corner, cda_straight, cda_corner and pu_power_scale per
# team, and long_grip_ratio (shared) plus tyres.yaml SOFT mu_base (shared),
# within the physically plausible bounds in config/app.yaml calibration.bounds.
# Calibrated lines carry their bounds and either '# CALIBRATED T-026 ...' or,
# while the speed-RMSE limit is relaxed (owner round 11, until T-02A),
# '# CALIBRATED-PROVISIONAL (T-026, RMSE limit relaxed) ...'.

