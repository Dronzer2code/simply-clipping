# Every team name, driver name, power unit maker and livery colour here is
# invented for this project. Nothing in this file refers to a real team, driver
# or manufacturer. It exists so the simulator can run without real names
# (PRD CONSTRAINTS: public release with real names is UNRESOLVED licensing).
#
# Code references team_id / driver_id only (HR-06), so this file is a drop-in
# replacement for config/grid/real_2026.yaml.
#
# Driver skill ratings are calibration inputs (F20); 0.0 is the neutral value
# shown in the TRD grid schema. Invented drivers have no real reference, so
# they stay neutral until the owner chooses a spread.

