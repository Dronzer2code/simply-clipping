# F19 Grid Config: the real 2026 grid.
#
# Source: FastF1 `session.results` for the most recent 2026 race available at
# build time: 2026 round 17, Singapore Grand Prix (race date 2026-10-11).
# FastF1 3.8.3, cache at data/fastf1_cache/.
#
# team_id values are the FastF1 team ids; driver_id values are the FastF1
# driver abbreviations. Code references these ids only, never display_name
# (HR-06), so this file can be swapped for config/grid/fictional.yaml.
#
# Frozen snapshot, by owner decision (2026-10-19): normal (New Race) mode always
# uses this Singapore GP entry list. Compare modes (R4, F17/F18) MUST instead
# load the entry list of the real race being replayed, from FastF1.
#
# The FastF1 driver-info and session-info endpoints return no data for 2026
# sessions, so TeamColor comes back empty. The two team fields below come from:
#   - pu_maker  -> confirmed 2026 engine supply (owner, 2026-10-19)
#   - color_hex -> FastF1 3.8.3 bundled constants, fastf1/plotting/constants.json,
#                  season "2026", teams.<name>.colors.official (owner decision
#                  round 3: replaces the earlier approximate colours)
#
# Ferrari and Audi are both red, and Red Bull, Racing Bulls and Williams are all
# blue, so the UI MUST always show the driver code and team label beside the
# colour and MUST NOT rely on colour alone (docs/spec/UI_DESIGN.md).
# ui.fallback_palette in config/app.yaml covers any team whose colour is missing.
#
# Driver skill ratings are not published anywhere; they are calibration inputs
# (F20) and are left at the neutral 0.0 shown in the TRD grid schema.

