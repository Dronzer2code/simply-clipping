# F02 tyre compound coefficients for the model in docs/spec/TRD.md Tyres:
#
#   mu_tyre   = mu_base[compound] * f_temp(T_tyre) * f_wear(wear)
#   f_wear(w) = 1 - a_wear*w                                    for w <  cliff_w
#             = 1 - a_wear*cliff_w - b_wear*(w - cliff_w)       for w >= cliff_w
#   d(wear)/dt = k_wear[compound] * track.abrasiveness * ... * driver_mgmt_factor
#   dT/dt      = heat_gain * energy_into_tyre - cool_rate * (T - T_ambient_track)
#
# docs/spec/TRD.md records every coefficient here as UNKNOWN, to be set by F20
# calibration against FastF1 stint lap-time degradation. EVERY numeric value
# below is therefore a placeholder marked "# PLACEHOLDER: calibrate" (HR-09),
# ordered only so that SOFT is the fastest-degrading and HARD the slowest.
#
# c_rr is the rolling resistance coefficient (owner round 9: per compound, a
# tyre property; the Radar keeps its own radar.c_rr).
#
# wet_grip_factor is the compound's grip multiplier on a fully wet track; the
# slick / intermediate / wet crossover must emerge from these curves rather than
# from a hard-coded rule (TRD WEATHER, R2).
#
# MVP note: T_tyre may be fixed at t_optimal_c (MVP.md F02), so heat_gain and
# cool_rate are unused until T-100.

# Normalisation in the wear rate (TRD Tyres "/ norm"): the tyre work
# (|F_long| + |F_lat|) * v integrated over time, in J, that wears a tyre from 0
# to 1 when k_wear = 1, abrasiveness = 1 and driver_mgmt_factor = 1. docs/spec/TRD.md
# names it but gives no value. STRUCTURAL: about 30 laps of ~90 MJ of tyre work,
# so k_wear stays near 1 and carries the calibration (T-026).
wear_norm_j: 3.0e9 # STRUCTURAL

# Tyre load sensitivity (owner round 14, T-02A): friction falls as vertical load
# rises, mu(N) = mu * (N / n_ref_n)^(-k_load) with N = m g + downforce, on lateral
# and longitudinal grip alike (friction ellipse unchanged). Shared by all teams.
load_sensitivity:
  n_ref_n: 7580.6 # STRUCTURAL: static load at the calibration mass, (768 + 5 kg) x 9.80665
  k_load: 0.0848 # CALIBRATED-PROVISIONAL (T-02A fit 2) suzuka bounds 0.05-0.3; shared

compounds:
  SOFT:
    mu_base: 2.1811 # CALIBRATED-PROVISIONAL (T-02A fit 2) suzuka bounds 1.3-2.2; shared
    k_wear: 1.40 # PLACEHOLDER: calibrate
    cliff_w: 0.70 # PLACEHOLDER: calibrate
    a_wear: 0.10 # PLACEHOLDER: calibrate
    b_wear: 0.60 # PLACEHOLDER: calibrate
    heat_gain: 1.00 # PLACEHOLDER: calibrate
    cool_rate: 1.00 # PLACEHOLDER: calibrate
    t_optimal_c: 100.0 # PLACEHOLDER: calibrate
    wet_grip_factor: 0.40 # PLACEHOLDER: calibrate
    c_rr: 0.015 # PLACEHOLDER: calibrate
  MEDIUM:
    mu_base: 1.55 # PLACEHOLDER: calibrate
    k_wear: 1.00 # PLACEHOLDER: calibrate
    cliff_w: 0.80 # PLACEHOLDER: calibrate
    a_wear: 0.08 # PLACEHOLDER: calibrate
    b_wear: 0.50 # PLACEHOLDER: calibrate
    heat_gain: 1.00 # PLACEHOLDER: calibrate
    cool_rate: 1.00 # PLACEHOLDER: calibrate
    t_optimal_c: 100.0 # PLACEHOLDER: calibrate
    wet_grip_factor: 0.40 # PLACEHOLDER: calibrate
    c_rr: 0.015 # PLACEHOLDER: calibrate
  HARD:
    mu_base: 1.50 # PLACEHOLDER: calibrate
    k_wear: 0.70 # PLACEHOLDER: calibrate
    cliff_w: 0.90 # PLACEHOLDER: calibrate
    a_wear: 0.06 # PLACEHOLDER: calibrate
    b_wear: 0.40 # PLACEHOLDER: calibrate
    heat_gain: 1.00 # PLACEHOLDER: calibrate
    cool_rate: 1.00 # PLACEHOLDER: calibrate
    t_optimal_c: 100.0 # PLACEHOLDER: calibrate
    wet_grip_factor: 0.40 # PLACEHOLDER: calibrate
    c_rr: 0.015 # PLACEHOLDER: calibrate
  INTERMEDIATE:
    mu_base: 1.20 # PLACEHOLDER: calibrate
    k_wear: 1.20 # PLACEHOLDER: calibrate
    cliff_w: 0.80 # PLACEHOLDER: calibrate
    a_wear: 0.10 # PLACEHOLDER: calibrate
    b_wear: 0.50 # PLACEHOLDER: calibrate
    heat_gain: 1.00 # PLACEHOLDER: calibrate
    cool_rate: 1.00 # PLACEHOLDER: calibrate
    t_optimal_c: 70.0 # PLACEHOLDER: calibrate
    wet_grip_factor: 0.90 # PLACEHOLDER: calibrate
    c_rr: 0.015 # PLACEHOLDER: calibrate
  WET:
